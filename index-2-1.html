<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Kosmik Jang 🚀</title>
<style>
:root{--bg:#070b1f;--ink:#e8f1ff;--cyan:#38e8ff;--pink:#ff4fa3;--gold:#ffd24a;--panel:rgba(10,16,44,.82);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b1f;--ink:#e8f1ff}}
:root[data-theme="dark"]{--bg:#070b1f;--ink:#e8f1ff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;font-weight:700;font-size:14px;gap:6px;align-items:center;pointer-events:none;text-shadow:0 0 8px #000}
#hud span{background:var(--panel);padding:5px 12px;border-radius:999px;box-shadow:0 0 12px rgba(56,232,255,.22),inset 0 0 8px rgba(56,232,255,.12);backdrop-filter:blur(6px);border:1px solid rgba(56,232,255,.35)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,7,22,.5);padding:20px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
#ov.h{display:none}
.card{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:340px;max-height:88vh;overflow-y:auto;touch-action:pan-y;text-align:center;background:var(--panel);border:1px solid rgba(56,232,255,.4);border-radius:22px;padding:24px 22px;box-shadow:0 0 40px rgba(56,232,255,.18)}
h1{text-shadow:0 0 18px rgba(56,232,255,.7);margin:0 0 6px;font-size:32px;letter-spacing:.5px;color:var(--cyan)}
p{margin:6px 0;line-height:1.45;font-size:15px;max-width:60ch}
button{margin-top:16px;font:inherit;font-weight:800;font-size:18px;padding:12px 30px;border:0;border-radius:999px;color:#04101f;background:linear-gradient(135deg,var(--cyan),#7affc1);cursor:pointer;box-shadow:0 0 22px rgba(56,232,255,.5)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:active{transform:scale(.96)}
.card button{display:block;width:100%}
.alt{margin-top:10px;font-size:16px;background:transparent;color:var(--ink);border:2px solid var(--cyan);box-shadow:none}
#pb{pointer-events:auto;margin:0;width:auto;font-size:16px;padding:4px 10px;background:var(--panel);color:var(--ink);border:1px solid rgba(56,232,255,.35);box-shadow:none}
ul{margin:8px 0;padding:0;list-style:none;text-align:left;font-size:14.5px;line-height:1.45}
li{margin:7px 0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.sk{margin:0!important;padding:6px 4px 8px!important;font-size:13px!important;font-weight:700;background:rgba(56,232,255,.08)!important;color:var(--ink)!important;border:2px solid rgba(56,232,255,.25)!important;border-radius:14px!important;box-shadow:none!important}.sk.vip{border-color:#ff9ae0!important;background:linear-gradient(135deg,rgba(255,79,163,.18),rgba(255,210,74,.14))!important;box-shadow:0 0 14px rgba(255,154,224,.4)!important}.sk.vip:last-child{grid-column:1/-1}.sk.lk canvas{filter:grayscale(1) brightness(.4)}.sk.on{border-color:var(--gold)!important;box-shadow:0 0 16px rgba(255,210,74,.5)!important}.sk canvas{position:static;inset:auto;width:80px;height:96px;display:block;margin:0 auto}
.hd{margin:14px 0 4px;font-weight:800;font-size:14px;color:var(--gold);text-align:left}.nt{font-size:12.5px;opacity:.7}.rw{display:flex;gap:8px;align-items:center;margin:3px 0;padding:6px 8px;border-radius:10px;background:rgba(56,232,255,.06);font-size:14px;text-align:left}.rw b{width:30px;text-align:center;flex:none}.rw .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rw em{font-style:normal;font-weight:800;color:var(--cyan)}.rw.lg em{color:var(--gold)}.rw.lg{background:rgba(255,210,74,.07)}.rw.t10{padding:9px 10px;font-size:15.5px;background:linear-gradient(90deg,rgba(255,210,74,.26),rgba(255,79,163,.14));border:1px solid rgba(255,210,74,.55);box-shadow:0 0 14px rgba(255,210,74,.22)}.rw.t10 .nm{font-weight:800;color:#fff3c4}.rw.t10 em{font-size:16px;text-shadow:0 0 8px rgba(255,210,74,.6)}.rw.p1{background:linear-gradient(90deg,rgba(255,210,74,.5),rgba(255,160,40,.2));box-shadow:0 0 22px rgba(255,210,74,.5);font-size:17px}.rw.p2{border-color:#dfe8ff;background:linear-gradient(90deg,rgba(220,232,255,.38),rgba(120,150,220,.12));box-shadow:0 0 16px rgba(200,220,255,.35)}.rw.p3{border-color:#e0904a;background:linear-gradient(90deg,rgba(224,144,74,.4),rgba(160,70,20,.12));box-shadow:0 0 16px rgba(224,144,74,.35)}.sp{height:6px}
.rw.me{background:rgba(255,79,163,.22);outline:1px solid var(--pink)}
input{font:inherit;font-size:17px;width:100%;box-sizing:border-box;margin-top:10px;padding:11px 14px;border-radius:14px;border:2px solid rgba(56,232,255,.4);background:rgba(4,7,22,.6);color:var(--ink);text-align:center;user-select:text;-webkit-user-select:text;touch-action:auto}
.big{font-size:44px;font-weight:900;color:var(--gold);margin:2px 0}
#it{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:none;justify-content:space-between;padding:0 16px;pointer-events:none;z-index:3}
#it button{pointer-events:auto;margin:0;width:64px;height:64px;padding:0;border-radius:50%;font-size:26px;touch-action:manipulation;position:relative;background:var(--panel);color:var(--ink);border:2px solid #7affc1;box-shadow:0 0 18px rgba(56,232,255,.5)}
#ip{border-color:var(--gold)!important}
#it b{position:absolute;right:-4px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#1a1200;font-size:13px;line-height:22px}
.wl{display:inline-block;margin:0 0 8px;padding:6px 18px;border-radius:999px;font-weight:900;font-size:20px;color:#1a1200;background:linear-gradient(135deg,#ffe27a,#ffb02a);box-shadow:0 0 18px rgba(255,210,74,.6)}
.gift{background:linear-gradient(135deg,#ffe27a,#ffb02a)!important;color:#1a1200!important;animation:pl 1.2s infinite}
@keyframes pl{50%{transform:scale(1.04);box-shadow:0 0 30px rgba(255,210,74,.9)}}
.by{width:auto!important;margin:0!important;padding:8px 14px!important;font-size:15px!important;background:linear-gradient(135deg,#ffe27a,#ffb02a)!important;color:#1a1200!important;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">⭐ 0</span><span id="lv">🌌 1</span><span id="lf">❤️ 3</span><button id="pb" aria-label="Pauza">⏸️</button></div>
<div id="it"><button id="ih"></button><button id="ip"></button></div>
<div id="ov"><div class="card" id="card"></div></div>
<script>
const C=document.getElementById('c');let X=C.getContext('2d');
let skin=0,W,H,dpr,S,best=0,run=false,paused=false,gen=0,last=0,AC=null;
try{best=+localStorage.getItem('kj_best')||0}catch(e){}
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let coins=LS('kj_coins',0),invHp=LS('kj_hp',0),invPw=LS('kj_pw',0),own=LS('kj_own',[]),claimT=LS('kj_claim',0);
if(!claimT){claimT=Date.now();SV('kj_claim',claimT)}
const PRICE=4,SKP=11,HOUR=3600000;let PV=0,pend=-1;
const saveAll=()=>{SV('kj_coins',coins);SV('kj_hp',invHp);SV('kj_pw',invPw);SV('kj_own',own)};
try{skin=Math.min(12,+localStorage.getItem('kj_skin')||0)}catch(e){}
if(skin>9&&!own.includes(skin))skin=0;
const fmt=ms=>{const t=Math.ceil(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const walletInner=()=>`🪙 ${coins}`;
const wallet=()=>`<div class="wl" id="wl">${walletInner()}</div>`;
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:99;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,#ff4fa3,#ffd24a);color:#1a0a2a;font:800 15px sans-serif;box-shadow:0 0 24px rgba(255,210,74,.6);text-align:center;transition:opacity .5s;max-width:80vw';document.body.appendChild(d);setTimeout(()=>d.style.opacity=0,1800);setTimeout(()=>d.remove(),2400)}
const claimHTML=()=>{const r=HOUR-(Date.now()-claimT);return r<=0?`<button id="claim" class="gift">🎁 1 tangani olish 🪙</button>`:`<button id="claim" class="alt" style="opacity:.65">⏳ Keyingi tanga: ${fmt(r)}</button>`};
function bindClaim(){const b=document.getElementById('claim');if(!b)return;b.onclick=()=>{if(Date.now()-claimT<HOUR)return;coins++;claimT=Date.now();SV('kj_claim',claimT);saveAll();toast('🪙 +1 tanga olindi!');tick()}}
function tick(){const b=document.getElementById('claim');if(b){const r=HOUR-(Date.now()-claimT),ready=r<=0;if(ready!==b.classList.contains('gift')){b.outerHTML=claimHTML();bindClaim()}else if(!ready)b.textContent='⏳ Keyingi tanga: '+fmt(r)}const w=document.getElementById('wl');if(w)w.innerHTML=walletInner()}
setInterval(tick,1000);
const ih=document.getElementById('ih'),ip=document.getElementById('ip'),itw=document.getElementById('it');
function itemsUI(on){itw.style.display=on&&(invHp>0||invPw>0)?'flex':'none';ih.style.visibility=invHp>0?'visible':'hidden';ip.style.visibility=invPw>0?'visible':'hidden';ih.innerHTML='❤️<b>'+invHp+'</b>';ip.innerHTML='⚡<b>'+invPw+'</b>'}
function useIt(e,k){e.stopPropagation();e.preventDefault();if(!run)return;
 if(k==='h'){if(invHp<1)return;if(S.lives>=7){toast("Jon to'liq (7)");return}S.lives++;invHp--;boom(S.x,S.y,'#7affc1',12);beep(900,.15,'sine',.06)}
 else{if(invPw<1)return;if(S.wp>=15){toast("Quvvat to'liq (15)");return}S.wp++;invPw--;boom(S.x,S.y,'#ffd24a',12);beep(1000,.15,'sine',.06)}
 saveAll();ui();itemsUI(1)}
ih.onpointerdown=e=>useIt(e,'h');ip.onpointerdown=e=>useIt(e,'p');
function toMenu(){run=false;paused=false;gen++;if(S&&S.score>best){best=S.score;try{localStorage.setItem('kj_best',best)}catch(e){}submit(S.score)}showStart(false)}
function showShop(back){const c=document.getElementById('card');
 const row=(ic,nm,ds,id,have)=>`<div class="rw" style="gap:10px;padding:10px;margin:8px 0"><div style="font-size:30px">${ic}</div><div style="flex:1;text-align:left"><b>${nm}</b><div class="nt">${ds}</div><div class="nt">Sizda: <b>${have}</b></div></div><button class="by" id="${id}">${PRICE} 🪙</button></div>`;
 c.innerHTML=wallet()+`<h1>Do'kon 🛒</h1>`+row('❤️','Jon',"+1 jon (eng ko'pi 7)",'byh',invHp)+row('⚡','Quvvat',"Qurol +1 daraja (eng ko'pi 15)",'byp',invPw)+`<p class="nt">O'yin boshlanganda sotib olganlaringiz ekranning pastida chiqadi. Bosganingizda bittasi ishlaydi.</p><button id="bk">Orqaga ◀️</button>`;
 document.getElementById('ov').classList.remove('h');
 const buy=k=>{if(coins<PRICE){toast(`Tanga yetmaydi: ${PRICE} 🪙 kerak`);return}coins-=PRICE;if(k==='h')invHp++;else invPw++;saveAll();showShop(back)};
 document.getElementById('byh').onclick=()=>buy('h');document.getElementById('byp').onclick=()=>buy('p');document.getElementById('bk').onclick=back}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const stars=Array.from({length:110},()=>{const z=Math.random();return{x:Math.random(),y:Math.random(),s:z*1.9+.5,v:z*70+12,c:['#cfe3ff','#ffffff','#9fd8ff','#ffd9f0'][Math.floor(Math.random()*4)]}});
function beep(f,d,t='square',v=.05){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function reset(){S={cn:100,ec:0,score:0,lives:3,level:1,fire:0,spawn:0,inv:0,wp:1,shake:0,bul:[],en:[],pt:[],pu:[],tx:W/2,ty:H*.78,x:W/2,y:H*.78,combo:0,eb:[],boss:null,nb:4,bk:0,bw:0,warn:0,puT:30+Math.random()*10}}
function ui(){document.getElementById('sc').textContent='⭐ '+S.score+' 🪙'+coins;document.getElementById('lv').textContent='🌌 '+S.level+' ⚡'+S.wp+'/15';document.getElementById('lf').textContent=S.lives>0?'❤️ '+S.lives:'💀'}
function showStart(over){
 const o=document.getElementById('ov'),c=document.getElementById('card');
 c.innerHTML=wallet()+(over
 ?`<h1>O'yin tugadi 💥</h1><div class="big">${S.score}</div><p>Rekord: 🏆 ${best}</p><p>🪙 Bu o'yinda: +${S.ec||0}</p><p>${S.score>=best&&S.score>0?'Yangi rekord! 🎉🥳':'Yana urinib ko\'ring! 💪'}</p><button id="go">Qayta o'ynash 🔁</button>${claimHTML()}<button class="alt" id="shop">🛒 Do'kon</button><button class="alt" id="sk">Skinlar 🎨</button><button class="alt" id="lb">🏆 Global reyting</button>`
 :`<h1>Kosmik Jang 🚀</h1><p>Barmog'ingiz bilan kemani suring 👆, u o'zi o'q uzadi 🔫</p><p>👾 Dushmanlarni yo'qoting<br>⚡ Quvvat oling — qurol kuchayadi<br>💚 Yurak — jon qo'shadi<br>👹 Boss: 4, 16, 32, 64... darajalarda</p><p>Kompyuterda: ⬅️➡️⬆️⬇️ yoki WASD</p><p>🏆 Rekord: ${best}</p><input id="nm" maxlength="14" placeholder="Ismingizni yozing" autocomplete="off" ${TU?'style="display:none"':''} value="${esc(pname)}"><button id="go">Boshlash 🎮</button><button class="alt" id="rl">Qoidalar 📖</button>${claimHTML()}<button class="alt" id="shop">🛒 Do'kon</button><button class="alt" id="sk">Skinlar 🎨</button><button class="alt" id="lb">🏆 Global reyting</button>`);
 o.classList.remove('h');document.getElementById('go').onclick=over?start:()=>{const nm=document.getElementById('nm'),v=nm.value.trim();if(v.length<2){nm.style.borderColor='#ff4fa3';nm.placeholder='Ism kiriting (kamida 2 harf)';nm.focus();return}pname=v.slice(0,14);try{localStorage.setItem('kj_name',pname)}catch(e){}start()};const rl=document.getElementById('rl');if(rl)rl.onclick=()=>showRules(()=>showStart(false));const sk=document.getElementById('sk');if(sk)sk.onclick=()=>showSkins(()=>showStart(over));const lb=document.getElementById('lb');if(lb)lb.onclick=()=>showBoard(()=>showStart(over));const sh=document.getElementById('shop');if(sh)sh.onclick=()=>showShop(()=>showStart(over));bindClaim();itemsUI(0);
}
function go(){const g=++gen;last=performance.now();const f=t=>{if(g!==gen||!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(f)};requestAnimationFrame(f)}
function pause(){if(!run)return;run=false;paused=true;showPause()}
function resume(){if(!paused)return;paused=false;run=true;itemsUI(1);document.getElementById('ov').classList.add('h');go()}
function showPause(){const c=document.getElementById('card');c.innerHTML=wallet()+`<h1>Pauza ⏸️</h1><button id="b1">Davom etish ▶️</button><button class="alt" id="b2">Boshidan boshlash 🔁</button><button class="alt" id="b6">🏠 Menyu</button><button class="alt" id="bs">🛒 Do'kon</button><button class="alt" id="b4">Skinlar 🎨</button><button class="alt" id="b5">🏆 Global reyting</button><button class="alt" id="b3">O'yin qoidalari 📖</button>`;document.getElementById('ov').classList.remove('h');itemsUI(0);document.getElementById('b1').onclick=resume;document.getElementById('b2').onclick=start;document.getElementById('b3').onclick=()=>showRules(showPause);document.getElementById('b4').onclick=()=>showSkins(showPause);document.getElementById('b5').onclick=()=>showBoard(showPause);document.getElementById('bs').onclick=()=>showShop(showPause);document.getElementById('b6').onclick=toMenu}
function showRules(back){const c=document.getElementById('card');c.innerHTML='<h1>Qoidalar 📖</h1><ul><li>👆 Kemani barmoq bilan suring, u o\'zi o\'q uzadi. Kompyuterda: ⬅️➡️⬆️⬇️ yoki WASD, pauza — P.</li><li>❤️ 3 jon bilan boshlaysiz (eng ko\'pi 7). Dushman yoki o\'qqa tegsangiz jon kamayadi, 0 bo\'lsa o\'yin tugaydi.</li><li>⚡ Quvvat taxminan har 35 soniyada tushadi. Dastlabki 6 ta quvvat o\'qlar sonini oshiradi, 7–15-quvvatlar otish tezligi va zarba kuchini oshiradi (eng ko\'pi 15).</li><li>💚 Ba\'zan quvvat o\'rnida yurak tushadi va jon qo\'shadi.</li><li>🌌 Har 800 ballda daraja ko\'tariladi, dushmanlar kuchayadi.</li><li>👹 Boss 4, 16, 32, 64... darajalarda chiqadi, har keyingisi oldingisidan 2 barobar kuchli. Yengsangiz 2 ta 💚 va 2 ta ⚡ tushadi. Har boss yengilgach, oddiy dushmanlar 2 barobar chidamli bo\'lib qoladi.</li><li>🪙 Har 100 ballga 1 tanga, har soatda yana 1 tanga beriladi. Tangaga do\'konda jon ❤️ va quvvat ⚡ (4 🪙), maxsus skinlarni (11 🪙) olasiz. Sotib olganlaringiz o\'yinda pastda turadi, bossangiz ishlaydi.</li></ul><button id="bk">Orqaga ◀️</button>';document.getElementById('bk').onclick=back}
document.getElementById('pb').onclick=pause;
function start(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}reset();ui();itemsUI(1);document.getElementById('ov').classList.add('h');run=true;paused=false;go()}
function boom(x,y,col,n=14){for(let i=0;i<n*1.5;i++){const a=Math.random()*6.283,sp=Math.random()*200+40;S.pt.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:.5+Math.random()*.6,m:1,c:i%4?col:'#ffffff'})}(S.rg=S.rg||[]).push({x,y,t:performance.now(),c:col,R:n>30?150:n>14?80:55})}
// input
const keys={};
addEventListener('keydown',e=>{const kk=e.key.toLowerCase();if(kk==='p'||kk==='escape'){if(run)pause();else if(paused)resume();return}keys[kk]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
function pt(e){if(!S)return;S.tx=e.clientX;S.ty=e.clientY-(e.pointerType==='touch'?70:0)}
C.addEventListener('pointerdown',pt);C.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'||e.pointerType==='mouse')pt(e)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run)pause()});
function shoot(){S.lf=performance.now();
 const x=S.x,y=S.y-22,n=Math.min(S.wp,6),dm=1+Math.max(0,S.wp-6)*.4;
 for(let i=0;i<n;i++){const o=i-(n-1)/2;S.bul.push({x:x+o*9,y:y+Math.abs(o)*2,vx:n>=3?o*28:0,dm})}
 beep(720,.05,'square',.025);
}
function spawn(){
 const r=Math.random(),L=Math.min(S.level,20),x=30+Math.random()*(W-60);
 if(r<.58)S.en.push({x,y:-30,t:0,hp:1,r:16,vy:(90+L*9)*1.5,pts:10,c:'#ff4fa3',ph:0});
 else if(r<.85)S.en.push({x,y:-30,t:1,hp:1,r:14,vy:(80+L*7)*1.5,pts:20,c:'#ffd24a',ph:Math.random()*6,x0:x});
 else S.en.push({x,y:-40,t:2,hp:(3+Math.floor(L/4))*2,r:24,vy:(50+L*4)*1.5,pts:50,c:'#a78bfa',ph:0});
 const e=S.en[S.en.length-1];e.hp*=Math.pow(2,S.bw);e.mhp=e.hp;
}
function hurt(){
 if(S.inv>0)return;S.lives--;S.inv=1.8;S.shake=.35;S.hf=performance.now();S.combo=0;boom(S.x,S.y,'#38e8ff',24);beep(110,.35,'sawtooth',.08);ui();
 if(S.lives<=0){run=false;if(S.score>best){best=S.score;try{localStorage.setItem('kj_best',best)}catch(e){}}submit(S.score);setTimeout(()=>showStart(true),500)}
}
function update(dt){while(S.score>=S.cn){S.cn+=100;coins++;S.ec++;saveAll();(S.fl=S.fl||[]).push({x:S.x,y:S.y-34,v:'1 🪙',g:1,t:performance.now()});ui();beep(1400,.08,'sine',.04)}
 const sp=420*dt;
 if(keys['arrowleft']||keys['a'])S.tx-=sp;if(keys['arrowright']||keys['d'])S.tx+=sp;
 if(keys['arrowup']||keys['w'])S.ty-=sp;if(keys['arrowdown']||keys['s'])S.ty+=sp;
